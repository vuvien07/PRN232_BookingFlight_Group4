<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test Flight API</h1>
    <button onclick="testAPI()">Test Get All Flights</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            try {
                console.log('Testing API...');
                const response = await fetch('http://localhost:5077/api/Flight/GetAllFlights');
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                try {
                    const data = JSON.parse(text);
                    document.getElementById('result').innerHTML = `
                        <h3>Success!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } catch (jsonError) {
                    document.getElementById('result').innerHTML = `
                        <h3>JSON Parse Error</h3>
                        <p>Status: ${response.status}</p>
                        <p>Raw response: ${text}</p>
                        <p>Error: ${jsonError.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('result').innerHTML = `
                    <h3>Fetch Error</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
